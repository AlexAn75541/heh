<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message</title>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(135deg, #ffffff, #f0f8ff, #fff5f7, #f5f5ff, #fffef0, #f0fff4, #fff0f5, #ffffff);
            background-size: 600% 600%;
            animation: gradientShift 12s ease infinite;
            position: relative;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .message-container {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 90vw;
            max-height: 90vh;
        }

        .message {
            font-family: 'Dosis', sans-serif;
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 700;
            color: #333;
            text-align: center;
            padding: clamp(1rem, 3vw, 2rem);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            transform: scaleY(1.8);
            cursor: pointer;
            user-select: none;
            background: transparent;
            border: none;
            transition: transform 0.5s ease;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.2;
        }

        .message:hover {
            transform: scaleY(9);
        }

        .hidden-button {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(240, 248, 255, 0.3), rgba(255, 245, 247, 0.3));
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.5s ease, background 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .hidden-button.visible {
            opacity: 1;
        }

        .hidden-button:hover {
            background: linear-gradient(135deg, rgba(240, 248, 255, 0.5), rgba(255, 245, 247, 0.5));
            border-color: rgba(255, 255, 255, 0.6);
        }

        .footer {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Dosis', sans-serif;
            font-size: clamp(0.5rem, 1.5vw, 0.65rem);
            color: rgba(0, 0, 0, 0.3);
            opacity: 0.5;
            z-index: 1000;
        }

        .debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            display: none;
            z-index: 2000;
        }

        .debug-info.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="message-container" id="messageContainer">
        <button class="message" id="messageBtn" onclick="redirectToLink()">
            I'm dumb, please close this website
        </button>
    </div>
    
    <button class="hidden-button" id="hiddenButton"></button>
    
    <div class="footer">
        created by claude and some other AI because I have no idea how to make one
    </div>

    <div class="debug-info" id="debugInfo">
        <div>Debug Mode Active</div>
        <div id="debugStatus">Waiting...</div>
        <div style="margin-top: 10px; font-size: 10px;">
            Ctrl+Cmd+1: Start main animation<br>
            Ctrl+Cmd+2: Show hidden button<br>
            Ctrl+Cmd+3: Start button animation<br>
            Ctrl+Cmd+0: Toggle debug panel
        </div>
    </div>

    <script>
        const REDIRECT_URL = 'https://youtu.be/ihnkWRO6RK8?si=wBPTIpC5OUhaAoj4';
        const ANIMATION_DELAY = 300000; // 5 minutes - main message animation
        const BUTTON_APPEAR_DELAY = 180000; // 3 minutes after animation starts
        const BUTTON_FLY_DELAY = 2000; // 2 seconds after button appears

        const container = document.getElementById('messageContainer');
        const messageBtn = document.getElementById('messageBtn');
        const hiddenButton = document.getElementById('hiddenButton');
        const debugInfo = document.getElementById('debugInfo');
        const debugStatus = document.getElementById('debugStatus');
        
        let animationStarted = false;
        let buttonAnimationStarted = false;
        let debugMode = false;
        let x, y, dx, dy;
        let buttonX, buttonY, buttonDx, buttonDy;

        function updateDebugStatus(status) {
            if (debugMode) {
                debugStatus.textContent = status;
                console.log('Debug:', status);
            }
        }

        function initializePosition() {
            const containerRect = container.getBoundingClientRect();
            x = (window.innerWidth - containerRect.width) / 2;
            y = (window.innerHeight - containerRect.height) / 2;
            dx = 2;
            dy = 2;
            
            container.style.left = x + 'px';
            container.style.top = y + 'px';
        }

        function initializeButtonPosition() {
            buttonX = Math.random() * (window.innerWidth - 32);
            buttonY = Math.random() * (window.innerHeight - 32);
            buttonDx = 5; // Faster speed
            buttonDy = 5;
            
            hiddenButton.style.left = buttonX + 'px';
            hiddenButton.style.top = buttonY + 'px';
        }

        function redirectToLink() {
            window.location.href = REDIRECT_URL;
        }

        function animate() {
            if (!animationStarted) return;

            const containerRect = container.getBoundingClientRect();
            const containerWidth = containerRect.width;
            const containerHeight = containerRect.height;

            x += dx;
            y += dy;

            if (x + containerWidth >= window.innerWidth || x <= 0) {
                dx = -dx;
                x = Math.max(0, Math.min(x, window.innerWidth - containerWidth));
            }

            if (y + containerHeight >= window.innerHeight || y <= 0) {
                dy = -dy;
                y = Math.max(0, Math.min(y, window.innerHeight - containerHeight));
            }

            container.style.left = x + 'px';
            container.style.top = y + 'px';

            requestAnimationFrame(animate);
        }

        function animateButton() {
            if (!buttonAnimationStarted) return;

            buttonX += buttonDx;
            buttonY += buttonDy;

            if (buttonX + 32 >= window.innerWidth || buttonX <= 0) {
                buttonDx = -buttonDx;
                buttonX = Math.max(0, Math.min(buttonX, window.innerWidth - 32));
            }

            if (buttonY + 32 >= window.innerHeight || buttonY <= 0) {
                buttonDy = -buttonDy;
                buttonY = Math.max(0, Math.min(buttonY, window.innerHeight - 32));
            }

            hiddenButton.style.left = buttonX + 'px';
            hiddenButton.style.top = buttonY + 'px';

            requestAnimationFrame(animateButton);
        }

        function startMainAnimation() {
            updateDebugStatus('Main animation started');
            animationStarted = true;
            animate();
            
            // Schedule button appearance
            setTimeout(() => {
                showHiddenButton();
            }, debugMode ? 0 : BUTTON_APPEAR_DELAY);
        }

        function showHiddenButton() {
            updateDebugStatus('Hidden button visible');
            initializeButtonPosition();
            hiddenButton.classList.add('visible');
            
            // Schedule button animation
            setTimeout(() => {
                startButtonAnimation();
            }, debugMode ? 0 : BUTTON_FLY_DELAY);
        }

        function startButtonAnimation() {
            updateDebugStatus('Button animation started (flying)');
            buttonAnimationStarted = true;
            animateButton();
        }

        // Keyboard shortcuts for debugging (Ctrl+Cmd+Key on macOS)
        document.addEventListener('keydown', (e) => {
            // Check for Ctrl+Cmd combination
            if (e.ctrlKey && e.metaKey) {
                switch(e.key) {
                    case '0':
                        debugMode = !debugMode;
                        debugInfo.classList.toggle('active');
                        updateDebugStatus(debugMode ? 'Debug mode enabled' : 'Debug mode disabled');
                        break;
                    case '1':
                        startMainAnimation();
                        break;
                    case '2':
                        showHiddenButton();
                        break;
                    case '3':
                        startButtonAnimation();
                        break;
                }
            }
        });

        // Initialize position after font loads
        document.fonts.ready.then(() => {
            initializePosition();
            updateDebugStatus('Initialized - waiting for animation delay');
        });

        // Start main animation after delay
        setTimeout(() => {
            startMainAnimation();
        }, ANIMATION_DELAY);

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (!animationStarted) {
                    initializePosition();
                } else {
                    const containerRect = container.getBoundingClientRect();
                    x = Math.max(0, Math.min(x, window.innerWidth - containerRect.width));
                    y = Math.max(0, Math.min(y, window.innerHeight - containerRect.height));
                }
                if (buttonAnimationStarted) {
                    buttonX = Math.max(0, Math.min(buttonX, window.innerWidth - 32));
                    buttonY = Math.max(0, Math.min(buttonY, window.innerHeight - 32));
                }
            }, 100);
        });

        // Make the hidden button open the raw text in a new tab (no conversion)
        hiddenButton.addEventListener('click', (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            try {
                window.open('raw.html', '_blank', 'noopener');
            } catch (err) {
                window.location.href = 'raw.html';
            }
            return false;
        });

        // --- Deterrent: block common DevTools shortcuts and context menu ---
        // Note: This only deters casual users. It cannot stop a determined user.
        function blockDevToolsShortcuts(e) {
            try {
                const key = (e.key || '').toLowerCase();

                // F12
                if (e.key === 'F12' || key === 'f12') {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }

                // Ctrl+Shift+I/C/J (Windows/Linux) or Cmd+Shift+I (mac) and Cmd+Opt+I
                if ((e.ctrlKey && e.shiftKey && (key === 'i' || key === 'c' || key === 'j')) ||
                    (e.metaKey && e.shiftKey && key === 'i') ||
                    (e.metaKey && e.altKey && key === 'i')) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            } catch (err) {
                // ignore
            }
        }

        document.addEventListener('keydown', blockDevToolsShortcuts, true);
        document.addEventListener('contextmenu', function(ev) { ev.preventDefault(); return false; }, true);
        document.addEventListener('mousedown', function(ev) { if (ev.button === 2 || ev.button === 1) { ev.preventDefault(); ev.stopPropagation(); return false; } }, true);
    </script>
</body>
</html>
